<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="구미 중앙통제실">
  <title>구미 중앙통제실</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./mascot-icon-180.png?v=mascot-3">
  <link rel="icon" type="image/png" sizes="192x192" href="./mascot-icon-192.png?v=mascot-3">
  <style>
    :root { --tint: #E5EEFF; --accent: #2259A9; }
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #19191e;
      background: #f2f2f7;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    main {
      width: min(100%, 23rem);
      min-width: 0;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 1px 1px rgb(28 34 46 / 4%), 0 12px 36px -12px rgb(28 34 46 / 16%);
      overflow: hidden;
      text-align: center;
    }
    .portrait {
      position: relative;
      isolation: isolate;
      display: grid;
      justify-items: center;
      margin: 0;
      padding: 26px 16px 7px;
      background: radial-gradient(ellipse at 50% 54%, #fff 20%, rgb(255 255 255 / 75%) 57%, transparent 100%), var(--tint);
      border-bottom: 1px solid rgb(22 31 42 / 5%);
    }
    .portrait::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      width: 32px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 4px;
      background: #f2f2f7;
      box-shadow: inset 0 1px 2px rgb(22 31 42 / 15%);
    }
    .portrait img {
      display: block;
      height: clamp(136px, 30vh, 210px);
      height: clamp(136px, 30svh, 210px);
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
    .contact { padding: 1.4rem clamp(1rem, 6vw, 1.6rem) 1.45rem; }
    /* Show the full-color row of LG Display's two-row mobile logo. */
    .brand {
      display: block;
      width: 106px;
      height: auto;
      aspect-ratio: 338 / 64;
      object-fit: cover;
      object-position: bottom;
      margin: 1.2rem auto 0;
    }
    h1 {
      margin: 0;
      font-weight: 450;
      font-size: clamp(1.45rem, 6.4vw, 1.88rem);
      line-height: 1.35;
      letter-spacing: -.045em;
      word-break: keep-all;
    }
    .number {
      margin: .4rem 0 1.45rem;
      font-size: 1.2rem;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
      color: #505057;
    }
    .call {
      min-height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .7rem 1rem;
      border-radius: 1.7rem;
      color: #fff;
      background: var(--accent);
      font-size: 1.075rem;
      font-weight: 650;
      text-decoration: none;
    }
    .call:active { filter: brightness(.87); }
    .call:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .call svg { width: 1.15rem; height: 1.15rem; }
    @media (max-height: 460px) {
      .portrait img { height: 116px; }
      .contact { padding-block: 1rem; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="office">
    <div class="portrait">
      <img src="./mascot.png?v=mascot-3" width="600" height="852" alt="안전모를 쓰고 엄지를 든 마스코트">
    </div>
    <div class="contact">
      <h1 id="office"><strong>구미</strong> 중앙통제실</h1>
      <p class="number">054-717-0119</p>
      <a class="call" href="tel:0547170119" aria-label="구미 중앙통제실 054-717-0119 전화하기">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"/>
        </svg>
        전화하기
      </a>
      <img class="brand" src="./lg-display.png" width="338" height="64" alt="LG Display">
    </div>
  </main>
</body>
</html>
