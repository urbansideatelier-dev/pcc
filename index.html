<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1677ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="파주중앙통제실">
  <title>파주중앙통제실 전화</title>
  <link rel="icon" href="phone-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="phone-icon.svg">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      color: #172033;
    }

    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 18px 60px rgba(22, 48, 92, .14);
    }

    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: #1677ff;
      color: #fff;
      font-size: 44px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 26px;
      color: #687287;
      font-size: 18px;
    }

    a {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #1677ff;
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☎</div>
    <h1>파주중앙통제실</h1>
    <p>031-933-0119</p>
    <a href="tel:0319330119">전화 연결</a>
  </main>

  <script>
    window.addEventListener("load", () => {
      window.location.href = "tel:0319330119";
    });
  </script>
</body>
</html>
